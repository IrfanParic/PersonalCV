[build]
  command = "npm run build"
  publish = "dist/irfanparic"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/project-page/:projectId/index.html"
  to = "/project-page/:projectId/"
  status = 301
  force = true

# Existing prerendered files take precedence. Unknown paths return a real 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/page-unavailable/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
