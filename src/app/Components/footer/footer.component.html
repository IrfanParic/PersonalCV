<footer id="footer" class="border-t border-white/10 bg-[#0d0f13]">
  <div class="mx-auto flex max-w-[1200px] flex-wrap items-center justify-between gap-3 px-5 py-4 sm:px-8">
    <img src="assets/logo.svg" alt="Irfan Paric" class="h-8 w-8 object-contain" loading="lazy" />
    <p class="text-sm text-muted">&copy; {{ year }} Irfan Paric</p>
    <button type="button" (click)="scrolltop()" aria-label="Back to top" class="header-glass inline-flex w-12 items-center justify-center text-muted hover:text-accent sm:w-14">
      <i class="bi bi-chevron-up" aria-hidden="true"></i>
    </button>
  </div>
</footer>
