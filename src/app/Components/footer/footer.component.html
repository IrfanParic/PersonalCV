<footer id="footer" class="border-t border-white/10 bg-[#101925]">
  <div class="mx-auto flex max-w-[1200px] flex-wrap items-center justify-between gap-6 px-5 py-8 sm:px-8">
    <img src="assets/logo.svg" alt="Irfan Paric" class="h-10 w-10 object-contain" loading="lazy" />
    <p class="text-sm text-muted">&copy; {{ year }} Irfan Paric</p>
    <button type="button" (click)="scrolltop()" class="inline-flex items-center gap-3 rounded-md px-2 py-2 text-sm text-muted transition-colors hover:text-accent">
      Back to top <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </button>
  </div>
</footer>
